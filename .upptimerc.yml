# Upptime configuration — https://upptime.js.org/docs/configuration
#
# IMPORTANT: replace `owner` with your GitHub username or org BEFORE pushing.
# `repo` should match the repo name you create on GitHub.

owner: EmoexAI
repo: status

sites:
  - name: API
    url: https://api.emoexai.com/
    expectedStatusCodes:
      - 200
      - 401  # API root requires auth; reaching auth means service is up
      - 404
  - name: IEPCP
    url: https://iepcp.emoexai.com/
  - name: Pages
    url: https://pages.emoexai.com/

# Notifications: configure later if you want — Slack, email, Discord, etc.
# notifications:
#   - type: slack
#     channel: "C0123456789"

# Status website (the public-facing page rendered on GitHub Pages).
status-website:
  cname: status.emoexai.com   # set DNS CNAME → emoexai.github.io
  name: EmoEx Status
  introTitle: "System status"
  introMessage: "Availability, response times, and incident reports for EmoEx services."
  navbar:
    - title: EmoEx
      href: https://emoexai.com
    - title: Status
      href: /
  # Supported Upptime hooks. The site workflow copies assets to the export root.
  # Versioned URLs prevent a cached asset from outliving this configuration.
  scripts:
    - src: /status.js?v=1
      async: true
  css: |
    /* Ant Design's restrained surfaces and 8px spacing rhythm, without a second UI runtime.
       Blue marks actions; green/amber/red carry health information only. */
    :root {
      color-scheme: light;
      --body-background-color: #f5f5f5;
      --body-text-color: #1f1f1f;
      --card-background-color: #fff;
      --card-border-color: #d9d9d9;
      --nav-background-color: #fff;
      --nav-border-bottom-color: #e8e8e8;
      --nav-current-border-bottom-color: #0958d9;
      --muted: #595959;
      --subtle: #fafafa;
      --accent: #0958d9;
      --accent-soft: #e6f4ff;
      --up-border-left-color: #237804;
      --down-border-left-color: #cf1322;
      --degraded-border-left-color: #ad6800;
      --down-background-color: #fff1f0;
      --up-color-color: var(--body-text-color);
      --down-color-color: var(--body-text-color);
      --degraded-color-color: var(--body-text-color);
      --tag-color: #fff;
      --tag-up-background-color: #237804;
      --tag-down-background-color: #cf1322;
      --tag-degraded-background-color: #ad6800;
      --change-background-color: var(--accent-soft);
      --code-color: var(--body-text-color);
      --code-background-color: var(--subtle);
      --error-button-border-color: var(--accent);
      --error-button-background-color: var(--accent);
      --error-button-color: #fff;
      --submit-button-border-color: var(--accent);
      --submit-button-background-color: var(--accent);
      --submit-button-color: #fff;
      --graph-opacity: 1;
      --graph-filter: none;
      --bar-up: #52a548;
      --bar-down: #cf1322;
      --bar-partial: #ad6800;
      --bar-unknown: #d9d9d9;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --body-background-color: #141414;
        --body-text-color: #f0f0f0;
        --card-background-color: #1f1f1f;
        --card-border-color: #434343;
        --nav-background-color: #1f1f1f;
        --nav-border-bottom-color: #303030;
        --muted: #bfbfbf;
        --subtle: #262626;
        --accent: #69b1ff;
        --accent-soft: #111d2c;
        --up-border-left-color: #95de64;
        --down-border-left-color: #ff7875;
        --degraded-border-left-color: #ffd666;
        --down-background-color: #2a1215;
        --submit-button-background-color: #0958d9;
        --submit-button-border-color: #0958d9;
        --bar-up: #6bb85e;
        --bar-down: #ff7875;
        --bar-partial: #ffd666;
        --bar-unknown: #434343;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --body-background-color: #141414;
      --body-text-color: #f0f0f0;
      --card-background-color: #1f1f1f;
      --card-border-color: #434343;
      --nav-background-color: #1f1f1f;
      --nav-border-bottom-color: #303030;
      --muted: #bfbfbf;
      --subtle: #262626;
      --accent: #69b1ff;
      --accent-soft: #111d2c;
      --up-border-left-color: #95de64;
      --down-border-left-color: #ff7875;
      --degraded-border-left-color: #ffd666;
      --down-background-color: #2a1215;
      --submit-button-background-color: #0958d9;
      --submit-button-border-color: #0958d9;
      --bar-up: #6bb85e;
      --bar-down: #ff7875;
      --bar-partial: #ffd666;
      --bar-unknown: #434343;
    }
    /* Higher specificity than Upptime global.css, which follows this theme. */
    html body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      padding-bottom: 0;
    }
    body #sapper .container { max-width: 1040px; padding: 0 32px; }
    body #sapper nav { padding: 0; margin: 0 0 40px; }
    body #sapper nav .container { min-height: 72px; gap: 24px; }
    body #sapper nav ul { gap: 24px; }
    body #sapper nav a { padding: 12px 0; font-weight: 500; font-size: 14px; }
    body #sapper nav li:first-child a { font-weight: 650; font-size: 22px; letter-spacing: -.5px; }
    body #sapper nav [aria-current] { border: 0; color: var(--accent); }
    body #sapper h1 { font-size: 28px; font-weight: 600; letter-spacing: -.5px; line-height: 1.35; }
    body #sapper h2 { font-size: 20px; font-weight: 600; }
    body #sapper h3, body h4 { font-weight: 600; opacity: 1; }
    body #sapper main > header { margin-bottom: 24px; }
    body #sapper main > header p.lead { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
    body #sapper a { text-underline-offset: 3px; }
    body #sapper a:focus-visible, body button:focus-visible, body select:focus-visible,
    body #sapper input:focus-visible, body summary:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px;
    }
    body #sapper article { border-radius: 6px; }
    body #sapper article.link a::after { display: none; }
    body #sapper article.link a { color: var(--accent); }
    body #sapper section:empty { margin: 0; }
    body #sapper .overview {
      display: flex; gap: 16px; align-items: flex-start;
      padding: 24px; margin: 0 0 32px;
      background: var(--card-background-color); border: 1px solid var(--card-border-color); border-radius: 8px;
    }
    body #sapper .overview-icon {
      width: 28px; height: 28px; flex: 0 0 28px; border: 2px solid currentColor;
      border-radius: 50%; display: grid; place-items: center; margin-top: 2px;
      font-size: 18px; font-weight: 600; line-height: 1;
    }
    [data-state="up"] .overview-icon, .service-state[data-state="up"] { color: var(--up-border-left-color); }
    [data-state="down"] .overview-icon, .service-state[data-state="down"] { color: var(--down-border-left-color); }
    [data-state="degraded"] .overview-icon, .service-state[data-state="degraded"] { color: var(--degraded-border-left-color); }
    body #sapper .overview h2 { margin: 0; font-size: 22px; line-height: 1.4; }
    body #sapper .overview p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
    body #sapper .overview + section:empty { display: none; }
    body #sapper main.status-enhanced > article.up { display: none; }
    body #sapper main.status-enhanced > .f { margin: 0 0 16px; }
    body #sapper main.status-enhanced > .f form { display: none; }
    body #sapper main.status-enhanced > .f h2 { margin: 0; }
    body #sapper .services-range { font-size: 13px; color: var(--muted); }
    body #sapper .live-status { border: 1px solid var(--card-border-color); border-radius: 8px; overflow: hidden; background: var(--card-background-color); }
    body #sapper .live-status > article.graph {
      background-image: none !important; margin: 0; border: 0 !important; border-radius: 0;
      padding: 24px; color: var(--body-text-color);
    }
    body #sapper .live-status > article.graph + article.graph { border-top: 1px solid var(--card-border-color) !important; }
    body #sapper .live-status h4 { margin: 0; font-size: 16px; }
    body #sapper .live-status img.icon { display: none; }
    body #sapper .live-status h4 a { color: var(--body-text-color); text-decoration: none; }
    body #sapper .live-status h4 a:hover { color: var(--accent); text-decoration: underline; }
    body #sapper .live-status article.enhanced > div:not(.service-detail) { display: none; }
    body #sapper .live-status article.enhanced { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; }
    body #sapper .service-state { font-size: 13px; display: flex; align-items: center; gap: 7px; }
    body #sapper .service-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    body #sapper .service-detail { grid-column: 1 / -1; }
    body #sapper .service-metrics { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    body #sapper .service-metrics strong { color: var(--body-text-color); font-weight: 600; font-variant-numeric: tabular-nums; }
    body #sapper .uptime-bars { display: grid; grid-template-columns: repeat(90, minmax(0, 1fr)); gap: 3px; }
    body #sapper .uptime-day { height: 24px; border-radius: 2px; background: var(--bar-up); }
    body #sapper .uptime-day.partial { background: var(--bar-partial); }
    body #sapper .uptime-day.down { background: var(--bar-down); }
    body #sapper .uptime-day.unknown { background: var(--bar-unknown); }
    body #sapper .uptime-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
    body #sapper .uptime-info { margin-top: 10px; font-size: 13px; color: var(--muted); }
    body #sapper .uptime-info summary { cursor: pointer; width: fit-content; min-height: 32px; }
    body #sapper .uptime-info ul { max-height: 240px; overflow: auto; padding-left: 24px; font-variant-numeric: tabular-nums; }
    body #sapper .service-incidents { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
    body #sapper .service-incidents a { color: var(--accent); }
    body #sapper .service-footer { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 16px; margin-top: 8px; }
    body #sapper .service-footer .uptime-info, body #sapper .service-footer .service-incidents { margin: 0; }
    body #sapper .service-footer:has(details[open]) details { flex-basis: 100%; }
    body #sapper .service-footer summary { min-height: 44px; display: list-item; align-content: center; }
    body #sapper .history-note { font-size: 12px; color: var(--muted); margin: 12px 0 28px; }
    body #sapper .theme-control { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    body #sapper .theme-control select {
      min-height: 36px; font: inherit; color: var(--body-text-color); padding: 0 10px;
      background: var(--card-background-color); border: 1px solid var(--card-border-color); border-radius: 6px;
    }
    body #sapper .maillist-card { background: var(--card-background-color); border: 1px solid var(--card-border-color); border-radius: 8px; padding: 24px; margin: 28px 0; }
    body #sapper .maillist-card h2, body .maillist-card h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    body #sapper .maillist-card .maillist-lead { margin: 0 0 20px; max-width: 650px; font-size: 14px; color: var(--muted); }
    body #sapper .maillist-card form > label { flex-basis: 100%; font-size: 13px; }
    body #sapper .maillist-card form { display: flex; flex-wrap: wrap; gap: 8px; }
    body #sapper .maillist-card input[type="email"] { flex: 1 1 220px; min-width: 0; }
    body #sapper .maillist-card input, body .maillist-card button {
      min-height: 44px; box-sizing: border-box; padding: 8px 14px; border-radius: 6px; font: inherit; font-size: 14px;
      border: 1px solid var(--card-border-color); background: var(--card-background-color); color: var(--body-text-color);
    }
    body #sapper .maillist-card button { padding: 8px 24px; cursor: pointer; background: var(--submit-button-background-color); border-color: var(--submit-button-border-color); color: #fff; }
    body #sapper .maillist-card button:hover { filter: brightness(.92); }
    body #sapper .maillist-card button:disabled { opacity: .55; cursor: default; }
    body #sapper .maillist-msg { font-size: 14px; margin: 12px 0 0; }
    body #sapper .maillist-msg:empty { display: none; }
    /* Form feedback stays neutral; result text conveys success/error. */
    body #sapper #maillist-action { margin-top: 0; }
    body #sapper footer { padding: 24px; margin-top: 32px; border-top: 1px solid var(--nav-border-bottom-color); opacity: 1; font-size: 12px; color: var(--muted); }
    body #sapper footer p { margin: 0; }
    @media (max-width: 600px) {
      body #sapper .container { padding: 0 16px; }
      body #sapper nav { margin-bottom: 24px; }
      body #sapper nav .container { min-height: 64px; gap: 12px; }
      body #sapper nav ul { gap: 16px; }
      body #sapper .theme-control > span { display: none; }
      body #sapper h1 { font-size: 24px; }
      body #sapper .overview { padding: 20px 16px; gap: 12px; margin-bottom: 24px; }
      body #sapper .overview h2 { font-size: 18px; }
      body #sapper .live-status > article.graph, body .maillist-card { padding: 20px 16px; }
      body #sapper .service-metrics { font-size: 12px; gap: 8px; }
      body #sapper .uptime-bars { gap: 2px; }
      body #sapper .uptime-day { height: 22px; border-radius: 1px; }
      body #sapper .maillist-card input[type="email"], body .maillist-card button { flex-basis: 100%; }
      body #sapper .services-range { font-size: 12px; }
    }
    /* Keep the native Past Incidents section hidden on the homepage only. */
    main.container:has(.live-status) > section:last-of-type { display: none; }

  # Subscribe card, rendered client-side by the worker at status-api.
  #
  # It appears only when /api/health answers subscribe_enabled — a form that
  # drops the address on the floor is worse than no form, and that flag is
  # false until the GMAIL_* secrets are set (see worker/README.md).
  #
  # ⚠️ Every failure path below is silent. This page has to stay useful during
  # an outage, and that includes an outage of the subscription API itself, so
  # nothing here may throw into the page or block rendering.
  js: |
    (function () {
      "use strict";

      var API = "https://status-api.emoexai.com";
      var CARD_ID = "maillist";
      var ACTION_CARD_ID = "maillist-action";
      var TOKEN_RE = /^[0-9a-f]{64}$/;
      var MOUNT_TIMEOUT_MS = 20000;   // the page is a SPA; <main> can land late

      // Two deadlines, because the two calls wait on entirely different work.
      // One number for both was the bug: 8s is right for one of them and far
      // too short for the other.
      //
      // /api/health is a database-free read that only decides whether the card
      // appears. Nobody is waiting on it, so it stays short.
      //
      // /api/subscribe waits on the worker completing a whole SMTP
      // conversation with Gmail — connect, STARTTLS, AUTH, the message, the
      // 250 — plus its D1 round trips. That is a dozen round trips before a
      // reply is possible at all, and the worker has no shorter ceiling of its
      // own, so this has to cover the slow end of normal rather than the
      // average.
      //
      // One production send was measured on 2026-08-30: 200 in 7.5s. That is
      // a single sample, not a distribution, so it does not bound the slow
      // end — what it does show is that a *successful* send landed under half
      // a second inside the old 8s deadline. Ordinary variation exhausts a
      // margin that thin, which is why this is 30s rather than 10s.
      //
      // ⚠️ These are user-interface deadlines, not correctness ones. Hitting
      // one tells us only that we stopped waiting — never that the
      // subscription failed. Whatever this number is, the message on expiry
      // must stay honest about that; see SLOW_TEXT.
      var HEALTH_TIMEOUT_MS = 8000;
      var SUBSCRIBE_TIMEOUT_MS = 30000;

      // Confirm and unsubscribe are a single conditional D1 write with no mail
      // send anywhere in the path, so they do not need the subscribe budget.
      var ACTION_TIMEOUT_MS = 15000;

      function request(path, options, timeoutMs) {
        var opts = options || {};
        var controller = typeof AbortController === "function" ? new AbortController() : null;
        var timer = null;
        if (controller) {
          opts.signal = controller.signal;
          timer = setTimeout(function () { controller.abort(); }, timeoutMs);
        }
        function done() { if (timer) clearTimeout(timer); }
        return fetch(API + path, opts).then(function (response) {
          done();
          return response.json().catch(function () { return {}; }).then(function (body) {
            return { status: response.status, body: body };
          });
        }, function (error) {
          done();
          throw error;
        });
      }

      /**
       * Read `#subscription=<action>&token=<64hex>` and erase it in the same
       * breath.
       *
       * The token arrives in the fragment because a fragment is never sent to
       * a server: it stays out of GitHub Pages' logs and out of the Referer of
       * every asset this page loads. Scrubbing it here finishes the job — the
       * address bar, session history, a bookmark and anything the visitor
       * copy-pastes are all left without a live credential in them.
       *
       * Returns null unless this really is one of our links, so an unrelated
       * anchor on the page is left alone.
       */
      function takeSubscriptionAction() {
        var raw = window.location.hash || "";
        if (raw.charAt(0) === "#") raw = raw.slice(1);
        if (!raw) return null;

        var params = {};
        raw.split("&").forEach(function (pair) {
          var eq = pair.indexOf("=");
          if (eq < 0) return;
          try {
            params[decodeURIComponent(pair.slice(0, eq))] = decodeURIComponent(pair.slice(eq + 1));
          } catch (error) {
            /* malformed percent-escape: drop this pair, keep the rest */
          }
        });

        if (!Object.prototype.hasOwnProperty.call(params, "subscription")) return null;

        scrubFragment();

        var action = params.subscription;
        var token = params.token || "";
        // Validated here as well as in the worker: this value is whatever was
        // in the URL bar, so it is untrusted regardless of who sent the link.
        var known = action === "confirm" || action === "unsubscribe";

        // Keep the action when we know it even though the token is unusable —
        // it is what lets the card give advice specific to what they were
        // trying to do.
        if (!known) return { action: "invalid", token: "" };
        if (!TOKEN_RE.test(token)) return { action: "invalid-" + action, token: "" };

        return { action: action, token: token };
      }

      function scrubFragment() {
        try {
          if (window.history && window.history.replaceState) {
            window.history.replaceState(
              null,
              "",
              window.location.pathname + window.location.search
            );
          } else {
            window.location.hash = "";
          }
        } catch (error) {
          /* never break the page over the address bar */
        }
      }

      function whenContainer(callback) {
        var found = document.querySelector("main.container");
        if (found) return callback(found);

        var giveUp;
        var observer = new MutationObserver(function () {
          var node = document.querySelector("main.container");
          if (!node) return;
          observer.disconnect();
          clearTimeout(giveUp);
          callback(node);
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        giveUp = setTimeout(function () { observer.disconnect(); }, MOUNT_TIMEOUT_MS);
      }

      function say(node, text, kind) {
        node.textContent = text;
        node.className = kind ? "maillist-msg " + kind : "maillist-msg";
      }

      // Shown when our deadline fired, i.e. we stopped waiting rather than got
      // an answer. The request may still be in progress, so this must not
      // claim the subscription failed — it says what we actually know, which
      // is nothing.
      //
      // ⚠️ "a few minutes" is not padding. The worker only re-sends a
      // confirmation once per address per 5 minutes
      // (CONFIRM_RESEND_COOLDOWN_S in worker/src/index.js); inside that window
      // a retry mails nothing and answers "check your inbox" anyway. Inviting
      // a retry sooner than that just manufactures a confusing second attempt.
      var SLOW_TEXT =
        "This is taking longer than usual. The confirmation may still arrive — " +
        "check your inbox in a few minutes before trying again.";

      function errorText(result) {
        switch (result.body && result.body.error) {
          case "invalid_email":
            return "That does not look like an email address.";
          case "rate_limited":
            return "Too many attempts from your network. Try again in an hour.";
          case "subscriptions_closed":
            return "Subscriptions are not open yet.";
          case "send_failed":
            return "We could not send the confirmation email. Please try again later.";
          default:
            return "Something went wrong. Please try again later.";
        }
      }

      function submit(input, button, message) {
        var email = input.value.trim();
        if (!email) return;

        button.disabled = true;
        say(message, "Sending…", "");

        request("/api/subscribe", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: email })
        }, SUBSCRIBE_TIMEOUT_MS).then(function (result) {
          if (result.status === 200) {
            // The worker answers identically for a new, a pending and an
            // already-confirmed address, so this text cannot be used to test
            // whether someone is on the list. Show it verbatim.
            say(message, result.body.message || "Check your inbox to confirm.", "ok");
            input.value = "";
            return;
          }
          say(message, errorText(result), "err");
        }).catch(function (error) {
          // Our own deadline fired, so we never learned the outcome — saying
          // the service is unreachable would be a guess, and usually a wrong
          // one. Only a genuine transport failure gets that message.
          var abandoned = error && error.name === "AbortError";
          say(
            message,
            abandoned
              ? SLOW_TEXT
              : "Could not reach the subscription service. Please try again later.",
            "err"
          );
        }).then(function () {
          button.disabled = false;
        });
      }

      var ACTION_COPY = {
        confirm: {
          heading: "Confirm your subscription",
          lead:
            "This adds your address to the EmoEx Status list. No status alerts " +
            "are sent until you confirm below.",
          button: "Confirm subscription"
        },
        unsubscribe: {
          heading: "Unsubscribe from status emails",
          lead:
            "This removes your address from the EmoEx Status list. You can " +
            "subscribe again at any time.",
          button: "Unsubscribe"
        },
        // Three invalid cards, not one. A broken confirm link and a broken
        // unsubscribe link need opposite advice — subscribe again versus open
        // a recent email — and telling someone trying to leave the list to
        // "subscribe again" is the worst moment to get it wrong.
        "invalid-confirm": {
          heading: "Confirmation link not recognised",
          lead:
            "This confirmation link is incomplete or no longer current. Use " +
            "the subscription form on this page when it is available to " +
            "request a valid link.",
          button: null
        },
        "invalid-unsubscribe": {
          heading: "Unsubscribe link not recognised",
          lead:
            "This unsubscribe link is incomplete. Open any status email you " +
            "have received and use the unsubscribe link there — every message " +
            "carries one, and they do not expire.",
          button: null
        },
        invalid: {
          heading: "Link not recognised",
          lead: "This link is not one we recognise. Nothing has been changed.",
          button: null
        }
      };

      // Shown when an action request times out.
      //
      // ⚠️ Must never say "reload the page". The token was scrubbed from the
      // address bar the moment it was read, so a reload lands on the plain
      // status page with nothing to act on — the one instruction guaranteed
      // not to work. The button is re-enabled on failure, so the retry is
      // here; the fallback is the link in the email, which still holds the
      // token.
      var ACTION_SLOW_TEXT =
        "This is taking longer than usual — it may still have gone through. " +
        "Use the button again to check, or reopen the link from the email. " +
        "Reloading this page will not help: the link is no longer in the address bar.";

      function actionOutcome(action, status, body) {
        if (action === "confirm") {
          if (status === 200) {
            return body.status === "already_confirmed"
              ? { text: "You are already on the list — nothing more to do.", kind: "ok", retryable: false }
              : {
                  text:
                    "Confirmed. You will get an email whenever an EmoEx service " +
                    "goes down or recovers.",
                  kind: "ok",
                  retryable: false
                };
          }
          if (status === 409) {
            return {
              text:
                "This link is no longer valid because the address was " +
                "unsubscribed. Use the subscription form on this page when " +
                "it is available to start again.",
              kind: "err",
              retryable: false
            };
          }
          if (status === 404) {
            return {
              text:
                "This confirmation link is no longer valid. Use the subscription " +
                "form on this page when it is available to request a current link.",
              kind: "err",
              retryable: false
            };
          }
          return {
            text: "Something went wrong. Please try again later.",
            kind: "err",
            retryable: status >= 500
          };
        }

        if (status === 200) {
          return {
            text: "Unsubscribed. You will not receive any further status emails.",
            kind: "ok",
            retryable: false
          };
        }
        if (status === 404) {
          return {
            text: "This link is not recognised — you may already be unsubscribed.",
            kind: "err",
            retryable: false
          };
        }
        return {
          text: "Something went wrong. Please try again later.",
          kind: "err",
          retryable: status >= 500
        };
      }

      function runAction(action, token, button, message) {
        button.disabled = true;
        say(message, "Working…", "");

        request("/api/" + action, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token: token })
        }, ACTION_TIMEOUT_MS).then(function (result) {
          var outcome = actionOutcome(action, result.status, result.body || {});
          say(message, outcome.text, outcome.kind);
          // Leave the button disabled once it has worked; re-enable only so a
          // real failure can be retried.
          if (outcome.retryable) button.disabled = false;
        }).catch(function (error) {
          say(
            message,
            error && error.name === "AbortError"
              ? ACTION_SLOW_TEXT
              : "Could not reach the subscription service. Please try again later.",
            "err"
          );
          button.disabled = false;
        });
      }

      /**
       * The card a visitor lands on from an email link.
       *
       * ⚠️ It performs nothing on render. The request goes out only after a
       * click, because everything that fetches a link without a human —
       * Gmail's scanner, a chat client's preview, a browser prefetch — issues
       * GETs, and any of them completing a double opt-in would defeat the
       * point of having one. The worker's GET only redirects here for the same
       * reason.
       */
      function buildActionCard(pending) {
        var copy = ACTION_COPY[pending.action];

        var card = document.createElement("div");
        card.id = ACTION_CARD_ID;
        card.className = "maillist-card";
        // Programmatically focusable but not in the tab order. The card is
        // injected after load, at the top of a page the visitor did not
        // request — without moving focus here, a screen reader carries on
        // announcing the status list and never mentions why they arrived.
        card.setAttribute("tabindex", "-1");
        card.setAttribute("role", "region");
        card.setAttribute("aria-label", copy.heading);

        var heading = document.createElement("h2");
        heading.textContent = copy.heading;
        card.appendChild(heading);

        var lead = document.createElement("p");
        lead.className = "maillist-lead";
        lead.textContent = copy.lead;
        card.appendChild(lead);

        var message = document.createElement("p");
        message.className = "maillist-msg";
        message.setAttribute("role", "status");
        message.setAttribute("aria-live", "polite");

        if (copy.button) {
          var form = document.createElement("form");
          var button = document.createElement("button");
          button.type = "submit";
          button.textContent = copy.button;
          form.appendChild(button);
          card.appendChild(form);

          form.addEventListener("submit", function (event) {
            event.preventDefault();
            runAction(pending.action, pending.token, button, message);
          });
        }

        card.appendChild(message);
        return card;
      }

      /**
       * Mount only after the generated Upptime app has finished hydrating.
       * Inserting into main.container while Svelte is still claiming it can
       * make hydration remove our node; by then the credential is already
       * scrubbed from the URL and cannot be recovered from a reload.
       */
      var actionMountObserver = null;

      function mountActionCard(pending) {
        // A new same-tab mail link supersedes the previous action and its
        // observer. Keep one watcher tied to the current in-memory token.
        if (actionMountObserver) actionMountObserver.disconnect();

        function install() {
          whenContainer(function (container) {
            var card = buildActionCard(pending);
            var existing = document.getElementById(ACTION_CARD_ID);
            if (existing && existing.parentNode) {
              existing.parentNode.replaceChild(card, existing);
            } else {
              container.insertBefore(card, container.firstChild);
            }
            try {
              card.focus();
            } catch (error) {
              /* focus is a courtesy, never a reason to break the page */
            }
          });
        }

        // The real Upptime app can replace main.container *after* window.load
        // while Svelte finishes hydration. The credential has already been
        // scrubbed, so losing this node once would otherwise be unrecoverable.
        // Observe the document and restore the current action whenever a SPA
        // render removes it. A later hashchange disconnects this observer.
        actionMountObserver = new MutationObserver(function () {
          if (!document.getElementById(ACTION_CARD_ID)) install();
        });
        actionMountObserver.observe(document.documentElement, {
          childList: true,
          subtree: true
        });

        install();
      }

      var pageReady = document.readyState === "complete";
      var queuedAction = null;
      var loadHooked = false;

      function flushQueuedAction() {
        pageReady = true;
        if (!queuedAction) return;
        var next = queuedAction;
        queuedAction = null;
        mountActionCard(next);
      }

      function queueAction(pending) {
        // A second mail link opened in the same tab replaces the queued or
        // mounted action; the newest token is the one the visitor chose.
        queuedAction = pending;
        if (pageReady || document.readyState === "complete") {
          flushQueuedAction();
          return;
        }
        if (loadHooked) return;
        loadHooked = true;
        window.addEventListener("load", flushQueuedAction, { once: true });
      }

      function build() {
        var card = document.createElement("div");
        card.id = CARD_ID;
        card.className = "maillist-card";

        var heading = document.createElement("h3");
        heading.textContent = "Get notified by email";
        card.appendChild(heading);

        var lead = document.createElement("p");
        lead.className = "maillist-lead";
        // ⚠️ Do not promise one-click unsubscribe here. Following the link in
        // an email now lands on this page and asks before doing anything, so
        // it is two deliberate steps. Gmail's own List-Unsubscribe button is
        // still one click, but that is the mail client's affordance, not a
        // promise this page is in a position to make.
        lead.textContent =
          "One email when a service goes down, one when it recovers — nothing else. " +
          "Confirm the address once; every email carries an unsubscribe link.";
        card.appendChild(lead);

        var form = document.createElement("form");

        var label = document.createElement("label");
        label.textContent = "Email address";
        label.setAttribute("for", "maillist-email");
        form.appendChild(label);

        var input = document.createElement("input");
        input.id = "maillist-email";
        input.type = "email";
        input.required = true;
        input.autocomplete = "email";
        input.placeholder = "you@example.com";
        input.setAttribute("aria-label", "Email address");
        form.appendChild(input);

        var button = document.createElement("button");
        button.type = "submit";
        button.textContent = "Subscribe";
        form.appendChild(button);

        card.appendChild(form);

        var message = document.createElement("p");
        message.className = "maillist-msg";
        message.setAttribute("role", "status");
        message.setAttribute("aria-live", "polite");
        card.appendChild(message);

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          submit(input, button, message);
        });

        return card;
      }

      // The subscribe form can also be removed by Svelte hydration after a
      // fast health response. Retain the same card so typed input survives.
      function mountSubscribeCard() {
        var card = build();
        function install() {
          whenContainer(function (container) {
            if (!document.getElementById(CARD_ID)) container.appendChild(card);
          });
        }
        var observer = new MutationObserver(function () {
          if (!document.getElementById(CARD_ID)) install();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        install();
      }

      try {
        // Read and scrub the fragment first, before any await — the token
        // should not sit in the address bar for the length of a network call.
        var pending = takeSubscriptionAction();
        if (pending) queueAction(pending);

        // Fragment navigation can reuse an already-open status tab, so the
        // inline script is not evaluated again. Consume, scrub and replace
        // the action card for every later mail link as well.
        window.addEventListener("hashchange", function () {
          var next = takeSubscriptionAction();
          if (next) queueAction(next);
        });

        request("/api/health", null, HEALTH_TIMEOUT_MS).then(function (result) {
          if (result.status !== 200 || !result.body.subscribe_enabled) return;
          mountSubscribeCard();
        }).catch(function () {
          /* Subscription API unreachable: show no card, break nothing. */
        });
      } catch (error) {
        /* Old browser, missing fetch, anything at all: never break the page. */
      }
    })();

