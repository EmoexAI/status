name: CI

# Exposes the org-wide `ci-ok` gate for this repo. See EmoexAI/ci-shared.
#
# `push` matters here even though every Upptime commit carries `[skip ci]`:
# the bot's commits are skipped by Actions, but a human pushing through the
# ruleset bypass still gets checked.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  worker:
    uses: EmoexAI/ci-shared/.github/workflows/node.yml@v1
    with:
      package-manager: npm
      working-directory: worker
      # The worker ships as ES modules and wrangler bundles at deploy time,
      # so there is no build script. node.yml runs `npm run build` without
      # `--if-present`, which would fail outright rather than skip.
      run-build: false

  # The parts of this repo that are not the worker are configuration: the
  # Upptime config, the Cloud Run target list, and the health-check scripts.
  # Nothing compiles them, so a typo here is only found when a monitor
  # silently stops running.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      # history/ is bot-generated and rewritten every five minutes; it is
      # data, not configuration, and does not belong in a correctness check.
      - name: Parse every hand-written YAML file
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          failed = False
          for path in sorted(Path(".").rglob("*.y*ml")):
              if path.parts[0] in {".git", "history"}:
                  continue
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  print(f"::error file={path}::{exc}")
                  failed = True
              else:
                  print(f"ok {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Compile the health-check scripts
        run: python -m compileall -q scripts/

      - name: Check shell syntax
        run: for f in scripts/*.sh; do bash -n "$f" && echo "ok $f"; done

  # Single required status check for this repo. Keep the name stable — it is
  # what the branch ruleset points at. See EmoexAI/ci-shared for the contract.
  ci-ok:
    if: always()
    needs: [worker, config]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
